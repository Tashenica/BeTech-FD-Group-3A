<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medium Landing Page</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<body>
<!--Header-->
 <!--HEADER / NAVBAR-->
         <!--Navbar Developer-->
<header> 
    <div class= "container">
                <nav class="navbar">

             <div class="logo">Medium</div>
             <!--Hamburger Icon -->
             <div class="hamburger">
                <i class="fa-solid fa-bars"></i>
               </div>
              <!-- Navigation Links Container --> 
              <div class="nav-links">
                <ul>
                    <li><a href="#">Our story</a></li>
                    <li><a href="#">Membership</a></li>
                    <li><a href="#">Write</a></li>
                    <li><a href="#">Sign In</a></li>
                </ul>
                <!-- Get Started Call-To-Action (CTA) Button -->
                 <button class="btn-get-started">Get Started</button>
              </div>
        </nav>
        </div>
    </header>
<!--MAIN CONTENT-->
<main>

     <!--Testimonials Section-->
     <section class="testimonials">
    <h2>What readers are saying</h2>

    <div class="testimonial-container">

        <div class="testimonial-card">
            <p>"Medium changed the way I learn and discover new ideas."</p>
            <h4>— Sarah J.</h4>
        </div>

        <div class="testimonial-card">
            <p>"Thousands of quality articles all in one place."</p>
            <h4>— David M.</h4>
        </div>

    </div>
</section>
